project:
  type: website
  output-dir: _site
  execute-dir: project
  resources:
    - assets/
    - data/
    - course-plan.html
  pre-render: R/check-project.R
  render:
    - "*.qmd"

website:
  title: "Statistics for epidemiology"
  description: "An interactive course from probability to Bayesian hierarchical models, for MSc students in epidemiology and public health."
  # site-url: https://YOUR-USER.github.io/stats-epi-course/
  # repo-url: https://github.com/YOUR-USER/stats-epi-course
  search: true
  page-navigation: true
  reader-mode: false
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: methods.qmd
        text: Choosing a method
      - href: glossary.qmd
        text: Glossary
      - href: course-plan.html
        text: Course plan
  sidebar:
    style: docked
    search: false
    contents:
      - section: "Part I · Foundations"
        contents:
          - href: lesson-00.qmd
            text: "0 · Welcome: the city, the data and how to use the course"
          - href: lesson-01.qmd
            text: "1 · Describing data and epidemiological measures"
          - design.qmd
          - href: lesson-02.qmd
            text: "2 · Probability and conditional probability"
          - href: lesson-03.qmd
            text: "3 · Random variables and probability distributions"
          - href: lesson-04.qmd
            text: "4 · Sampling, sampling distributions and the central limit theorem"
          - href: lesson-05.qmd
            text: "5 · Likelihood and estimation"
          - href: lesson-06.qmd
            text: "6 · Confidence intervals and hypothesis tests"
      - section: "Part II · Frequentist regression"
        contents:
          - href: lesson-07.qmd
            text: "7 · Linear regression"
          - href: lesson-08.qmd
            text: "8 · Generalized linear models: logistic and Poisson regression"
          - href: lesson-09.qmd
            text: "9 · Confounding, effect modification and interaction"
          - href: lesson-10.qmd
            text: "10 · Model checking, comparison and selection"
          - href: lesson-11.qmd
            text: "11 · Nonlinear effects: categories, polynomials, splines and GAMs"
      - section: "Part III · Causal inference, measurement and burden"
        contents:
          - href: lesson-12.qmd
            text: "12 · Causal inference: from association to effect"
          - href: lesson-13.qmd
            text: "13 · Measurement error and misclassification"
          - href: lesson-14.qmd
            text: "14 · Measuring disease burden"
      - section: "Part IV · Time, space and clustering"
        contents:
          - href: lesson-15.qmd
            text: "15 · Time-series regression for health data"
          - href: lesson-16.qmd
            text: "16 · Distributed lag and distributed lag non-linear models"
          - href: lesson-17.qmd
            text: "17 · Spatial data and spatial autocorrelation"
          - href: lesson-18.qmd
            text: "18 · Clustered data and mixed-effects models"
      - section: "Part V · Bayesian modeling"
        contents:
          - freqbayes.qmd
          - href: lesson-19.qmd
            text: "19 · Bayesian thinking: from Bayes' rule to a model equation"
          - href: lesson-20.qmd
            text: "20 · Priors: what they say and how much they matter"
          - href: lesson-21.qmd
            text: "21 · Computing the posterior: Markov chain Monte Carlo"
          - href: lesson-22.qmd
            text: "22 · Bayesian regression and GLMs"
          - href: lesson-23.qmd
            text: "23 · Bayesian hypothesis testing and model comparison"
          - href: lesson-24.qmd
            text: "24 · Bayesian hierarchical models"
          - href: lesson-25.qmd
            text: "25 · Capstone: a district-level Bayesian DLNM with spatial pooling"
      - section: "Part VI · Machine learning meets Bayesian inference"
        contents:
          - href: lesson-26.qmd
            text: "26 · Bayesian additive regression trees (BART) and bartisan"
      - section: "Part VII · Causal tools from econometrics"
        contents:
          - href: lesson-27.qmd
            text: "27 · Causal tools from econometrics: trials, regression, IV, RD and DiD"
  page-footer:
    left: "All data are simulated. Course text CC BY 4.0, code MIT."
    right: "Built with [Quarto](https://quarto.org)"

bibliography: references.bib
link-citations: true
citation-location: document
reference-section-title: "References"

format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/course.css
    grid:
      sidebar-width: 260px
      body-width: 1100px
      margin-width: 200px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 2
    toc-title: "In this lesson"
    code-copy: true
    code-overflow: wrap
    highlight-style: a11y
    html-math-method: mathjax
    smooth-scroll: true
    anchor-sections: true
    include-after-body: assets/include-after.html

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: "#>"
    fig.width: 7
    fig.height: 4
