# Renders the Quarto site and publishes it to the gh-pages branch on every push to main.
# One-time setup: run `quarto publish gh-pages` locally once, then set
# Settings > Pages > Source to "Deploy from a branch", branch gh-pages, folder / (root).
on:
  workflow_dispatch:
  push:
    branches: main

name: Render and publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::sandwich
            any::dagitty
            any::dlnm
            any::spdep
            any::lme4

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
